plugins {
    id 'com.android.application'
}

def serverUrl = project.findProperty('SERVER_URL') ?: System.getenv('SERVER_URL') ?: 'http://93.126.18.48'

android {
    namespace 'com.kashani.holding'
    compileSdk 35

    defaultConfig {
        applicationId "com.kashani.holding.v184test"
        minSdk 24
        targetSdk 35
        versionCode 1840
        versionName "18.4-test"
        buildConfigField "String", "SERVER_URL", '"' + serverUrl.replace('"','\\"') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
