name: Build Android Beta APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Beta server URL'
        required: false
        default: 'http://93.126.18.48'
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        env:
          SERVER_URL: ${{ inputs.server_url || 'http://93.126.18.48' }}
        run: gradle :app:assembleDebug -PSERVER_URL="$SERVER_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: Holding-Kashani-Beta-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
